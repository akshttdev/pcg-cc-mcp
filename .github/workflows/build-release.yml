name: Build & Release Binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Disable sccache (configured in .cargo/config.toml but unreliable in CI)
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
            ext: ""
          - os: macos-14  # M1 runner - much faster than macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-18
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: ${{ matrix.target }}
          cache-targets: true
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libssl-dev libsodium-dev libglib2.0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config opus libsodium openssl@3

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin server --bin orcha
        env:
          OPENSSL_DIR: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/openssl@3' || '' }}
          # Override .cargo/config.toml rustflags that specify lld (not available on CI runners)
          CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: ""

      - name: Create artifact directory
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/server${{ matrix.ext }} artifacts/server-${{ matrix.artifact_name }}${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/orcha${{ matrix.ext }} artifacts/orcha-${{ matrix.artifact_name }}${{ matrix.ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_name }}
          path: artifacts/*
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' crates/server/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Server version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la release-artifacts/

      - name: Create checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## Release v${{ steps.version.outputs.version }}

          **Commit:** ${{ github.sha }}
          **Built:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### Binaries

          | Binary | Platform | Architecture |
          |--------|----------|--------------|
          | server | Linux | x86_64 |
          | server | macOS | ARM64 (Apple Silicon) |
          | server | Windows | x86_64 |
          | orcha | Linux | x86_64 |
          | orcha | macOS | ARM64 (Apple Silicon) |
          | orcha | Windows | x86_64 |

          ### Checksums
          ```
          $(cat release-artifacts/SHA256SUMS.txt)
          ```
          EOF

      - name: Delete existing release (if exists)
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
