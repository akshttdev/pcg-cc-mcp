name: CI

on:
  pull_request:
    branches: [main, "dev/*"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  CARGO_TERM_COLOR: always
  # Disable sccache wrapper (configured in .cargo/config.toml but not installed in CI)
  RUSTC_WRAPPER: ""

jobs:
  backend-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-18
          components: rustfmt
      - run: cargo fmt --all -- --check

  backend-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-18
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsodium-dev
      - name: Clippy
        # Pre-existing bulk lints allowed until dedicated cleanup PR (467 total, mostly format args + collapsible_if)
        run: cargo clippy --all --all-targets -- -D warnings -A clippy::uninlined_format_args -A clippy::collapsible_if -A clippy::collapsible_match -A clippy::useless_format -A clippy::manual_range_contains -A clippy::too_many_arguments -A clippy::unnecessary_cast -A clippy::clone_on_copy -A clippy::needless_borrow -A clippy::single_char_add_str -A clippy::derivable_impls -A clippy::trim_split_whitespace -A clippy::field_reassign_with_default -A clippy::suspicious_doc_comments

  backend-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-18
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsodium-dev
      - name: Tests
        run: cargo test --workspace

  frontend-check:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: cd frontend && npx tsc --noEmit
      - name: ESLint
        run: pnpm run lint
      - name: Build check
        run: cd frontend && npx vite build

  types-check:
    name: Type generation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-18
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libopus-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libsodium-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types are up to date
        run: pnpm run generate-types:check

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit
        run: cargo audit
        continue-on-error: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
