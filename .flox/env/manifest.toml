## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
nodejs.pkg-path = "nodejs"
nodejs.outputs = "all"
pnpm.pkg-path = "pnpm"
rustup.pkg-path = "rustup"
cargo-watch.pkg-path = "cargo-watch"
sqlx-cli.pkg-path = "sqlx-cli"
cmake.pkg-path = "cmake"
libopus.pkg-path = "libopus"
libopus.outputs = "all"
pkg-config.pkg-path = "pkg-config"
pkg-config.outputs = "all"
sccache.pkg-path = "sccache"
lld.pkg-path = "lld"
ollama.pkg-path = "ollama"
python311.pkg-path = "python311"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
ORCHA_USERNAME = "Sirak"
SQLX_OFFLINE = "true"
PCG_SERVER_URL = "http://localhost:3000"
RUSTC_WRAPPER = "sccache"
# E2E test defaults — Playwright reads these at runtime
FRONTEND_PORT = "3000"
E2E_HEADED = "false"
E2E_BROWSER = "chromium"
# audiopus_sys requires cmake_minimum_required(VERSION 2.x) which CMake 4.x rejects;
# this tells CMake to allow policies from older cmake versions during the build
CMAKE_POLICY_VERSION_MINIMUM = "3.5"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  # Install Rust toolchain from rust-toolchain.toml (nightly + cranelift)
  export RUSTUP_HOME="${FLOX_ENV_CACHE}/rustup"
  export CARGO_HOME="${FLOX_ENV_CACHE}/cargo"
  if [ ! -d "$RUSTUP_HOME/toolchains" ]; then
    echo "Installing Rust toolchain (first time only)..."
    rustup-init -y --no-modify-path --default-toolchain none 2>/dev/null
  fi
  # Ensure toolchain from rust-toolchain.toml is installed
  if ! rustup show active-toolchain >/dev/null 2>&1; then
    rustup toolchain install nightly-2025-05-18 --profile default \
      --component rustc-codegen-cranelift-preview 2>/dev/null
  fi

  # Seed dev_assets from dev_assets_seed if missing (needed for server startup)
  if [ -d "$FLOX_ENV_PROJECT/dev_assets_seed" ] && [ ! -f "$FLOX_ENV_PROJECT/dev_assets/db.sqlite" ]; then
    echo "Seeding dev_assets from dev_assets_seed..."
    mkdir -p "$FLOX_ENV_PROJECT/dev_assets/artifacts"
    cp "$FLOX_ENV_PROJECT/dev_assets_seed/db.sqlite" "$FLOX_ENV_PROJECT/dev_assets/db.sqlite"
    cp "$FLOX_ENV_PROJECT/dev_assets_seed/config.json" "$FLOX_ENV_PROJECT/dev_assets/config.json" 2>/dev/null
  fi
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
common = '''
  export RUSTUP_HOME="${FLOX_ENV_CACHE}/rustup"
  export CARGO_HOME="${FLOX_ENV_CACHE}/cargo"
  export PATH="$CARGO_HOME/bin:$FLOX_ENV_PROJECT/target/release:$PATH"
  alias topsi="$FLOX_ENV_PROJECT/target/release/topsi"
  echo "Topsi CLI available — run: topsi status"
'''


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
