      },
      "sqlx-cli": {
        "pkg-path": "sqlx-cli"
      }
    },
    "vars": {
      "CMAKE_POLICY_VERSION_MINIMUM": "3.5",
      "E2E_BROWSER": "chromium",
      "E2E_HEADED": "false",
      "FRONTEND_PORT": "3000",
      "ORCHA_USERNAME": "Sirak",
      "PCG_SERVER_URL": "http://localhost:3000",
      "RUSTC_WRAPPER": "sccache",
      "SQLX_OFFLINE": "true"
    },
    "hook": {
      "on-activate": "  # Install Rust toolchain from rust-toolchain.toml (nightly + cranelift)\n  export RUSTUP_HOME=\"${FLOX_ENV_CACHE}/rustup\"\n  export CARGO_HOME=\"${FLOX_ENV_CACHE}/cargo\"\n  if [ ! -d \"$RUSTUP_HOME/toolchains\" ]; then\n    echo \"Installing Rust toolchain (first time only)...\"\n    rustup-init -y --no-modify-path --default-toolchain none 2>/dev/null\n  fi\n  # Ensure toolchain from rust-toolchain.toml is installed\n  if ! rustup show active-toolchain >/dev/null 2>&1; then\n    rustup toolchain install nightly-2025-05-18 --profile default \\\n      --component rustc-codegen-cranelift-preview 2>/dev/null\n  fi\n\n  # Seed dev_assets from dev_assets_seed if missing (needed for server startup)\n  if [ -d \"$FLOX_ENV_PROJECT/dev_assets_seed\" ] && [ ! -f \"$FLOX_ENV_PROJECT/dev_assets/db.sqlite\" ]; then\n    echo \"Seeding dev_assets from dev_assets_seed...\"\n    mkdir -p \"$FLOX_ENV_PROJECT/dev_assets/artifacts\"\n    cp \"$FLOX_ENV_PROJECT/dev_assets_seed/db.sqlite\" \"$FLOX_ENV_PROJECT/dev_assets/db.sqlite\"\n    cp \"$FLOX_ENV_PROJECT/dev_assets_seed/config.json\" \"$FLOX_ENV_PROJECT/dev_assets/config.json\" 2>/dev/null\n  fi\n"
    },
    "profile": {
      "common": "  export RUSTUP_HOME=\"${FLOX_ENV_CACHE}/rustup\"\n  export CARGO_HOME=\"${FLOX_ENV_CACHE}/cargo\"\n  export PATH=\"$CARGO_HOME/bin:$FLOX_ENV_PROJECT/target/release:$PATH\"\n  alias orcha=\"$FLOX_ENV_PROJECT/target/release/orcha\"\n  echo \"ORCHA CLI available — run: orcha status\"\n"
    },
    "options": {}
  },
