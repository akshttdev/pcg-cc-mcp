app = 'orcha-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  HOST = '0.0.0.0'
  BACKEND_PORT = '8080'
  FRONTEND_PORT = '8080'
  DATABASE_URL = 'sqlite:///app/dev_assets/db.sqlite'
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'orcha_data'
  destination = '/app/dev_assets'
