server {
    listen 80;
    server_name localhost;

    # Docker internal DNS — allows optional upstreams (apn-bridge) to be absent at startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Remove server version exposure
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Client body size limit (for file uploads)
    client_max_body_size 100M;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Documentation site - serve Mintlify static build at /docs
    location /docs {
        alias /app/docs-site;
        try_files $uri $uri/ $uri.html /docs/index.html;

        # Cache static assets
        location ~* ^/docs/.*\.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Frontend - serve static files from app container
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # Health check — self-contained so nginx starts even without apn-bridge
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # APN Bridge Server - Registration
    location /register {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # APN Bridge Server - Node operations
    location /api/node/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Peer discovery
    location /api/peers {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Mesh network operations
    location /api/mesh/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Message operations
    location /api/messages/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Network statistics
    location /api/network/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Task distribution (APN-specific only, not ORCHA tasks)
    location /api/node/tasks/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Bridge Server - Secure operations
    location /api/secure/ {
        set $apn_bridge apn-bridge;
        proxy_pass http://$apn_bridge:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APN Drive — WebDAV media filesystem
    # macOS mounts this as "PCG APN" because the URL path segment is the volume name
    # Connect via: Finder ⌘K → https://dashboard.powerclubglobal.com/PCG APN/
    location ~ "^/(PCG APN|dav)(/.*)?$" {
        # macOS WebDAV client sends OPTIONS first and expects DAV: 1, 2 to recognise
        # this as a WebDAV server. The CORS middleware swallows OPTIONS without it.
        if ($request_method = OPTIONS) {
            add_header DAV "1, 2";
            add_header MS-Author-Via "DAV";
            add_header Allow "OPTIONS, GET, HEAD, PROPFIND";
            add_header Content-Length 0;
            return 200;
        }

        rewrite "^/(PCG APN|dav)(/.*)$" /api/dav$2 break;
        rewrite "^/(PCG APN|dav)$" /api/dav/ break;
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large timeouts for 4K video streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for range-request streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Allow large media files
        client_max_body_size 0;
    }

    # Dashboard - WebSocket support for SSE (Server-Sent Events)
    # Note: This must come before the general /api/ block
    location /api/events/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard - General Backend API (catch-all for remaining /api/ endpoints)
    location /api/ {

        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
