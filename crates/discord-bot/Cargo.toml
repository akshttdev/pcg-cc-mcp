[package]
name = "discord-bot"
version = "0.0.1"
edition = "2021"
description = "Discord voice bot — Nora and Topsi join voice channels as AI participants"

[dependencies]
# Discord framework (twilight — modular, songbird-compatible)
twilight-gateway = { version = "0.15", default-features = false, features = ["rustls-native-roots"] }
twilight-model = "0.15"
twilight-http = { version = "0.15", default-features = false, features = ["rustls-native-roots"] }
twilight-cache-inmemory = "0.15"
twilight-validate = "0.15"

# Voice: songbird 0.4 with twilight feature
songbird = { version = "0.4", default-features = false, features = [
    "driver", "gateway", "rustls", "receive", "twilight",
] }

# Async runtime
tokio = { workspace = true }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP client (STT API calls, agent calls)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
db = { path = "../db" }

# Shared crates for voice + agents
nora = { path = "../nora" }

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.0"
once_cell = "1.20"
base64 = "0.21"
hound = "3.5"
