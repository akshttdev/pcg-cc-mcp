[package]
name = "pcg-dashboard"
version = "0.1.0"
description = "PCG Dashboard - Command Center for the Alpha Protocol Network"
authors = ["Powerclub Global"]
license = "MIT"
repository = "https://github.com/Powerclub-Global/pcg-cc-mcp"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pcg_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
tracing = "0.1"

# HTTP client (for backend health check)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# UUID generation
uuid = { version = "1.11", features = ["v4"] }

# System information
sysinfo = "0.32"

# Time
chrono = "0.4"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

# Mobile-specific plugins
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-barcode-scanner = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Use our patched zerocopy that makes AVX-512 conditional
[patch.crates-io]
zerocopy = { path = "/tmp/zerocopy" }
