services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: pcg-cc-mcp
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Enable GPU access for Chatterbox TTS and Ollama acceleration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
    environment:
      - ENABLE_AGENT_FLOW_ENGINE=1
      - HOST=0.0.0.0
      - BACKEND_PORT=3001
      - FRONTEND_PORT=3000
      - RUST_LOG=info
      - PCG_ASSET_DIR=/app/dev_assets
      # Ollama Configuration (Local LLM)
      - OLLAMA_BASE_URL=http://localhost:11434
      - OLLAMA_MODEL=deepseek-r1
      # Chatterbox TTS Configuration (Local Voice) - Using host Coqui TTS
      - CHATTERBOX_URL=http://172.17.0.1:8102
      - CHATTERBOX_PORT=8102
      - CHATTERBOX_DEVICE=cuda
      # Local Whisper STT (Sovereign Stack) - Using host Whisper server
      - WHISPER_URL=http://172.17.0.1:8101
      # NORA AI Assistant Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NORA_LLM_MODEL=${NORA_LLM_MODEL:-deepseek-r1}
      - NORA_LLM_TEMPERATURE=${NORA_LLM_TEMPERATURE:-0.7}
      - NORA_LLM_MAX_TOKENS=${NORA_LLM_MAX_TOKENS:-2000}
      # NORA Voice/TTS/STT Configuration (Optional - enables voice features)
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastus}
      # Twilio Phone Integration (Optional - enables phone calls to NORA)
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_WEBHOOK_BASE_URL=${TWILIO_WEBHOOK_BASE_URL:-}
      - TWILIO_SPEECH_LANGUAGE=${TWILIO_SPEECH_LANGUAGE:-en-GB}
      - TWILIO_TTS_VOICE=${TWILIO_TTS_VOICE:-Polly.Amy}
      - TWILIO_MAX_CALL_DURATION=${TWILIO_MAX_CALL_DURATION:-3600}
      - TWILIO_RECORDING_ENABLED=${TWILIO_RECORDING_ENABLED:-false}
      - TWILIO_GREETING_MESSAGE=${TWILIO_GREETING_MESSAGE:-}
      # AI/LLM API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NORA_ANTHROPIC_API_KEY=${NORA_ANTHROPIC_API_KEY:-}
      # Topsi Agent Configuration
      - TOPSI_LLM_PROVIDER=${TOPSI_LLM_PROVIDER:-ollama}
      - TOPSI_LLM_MODEL=${TOPSI_LLM_MODEL:-qwen2.5:7b}
      - TOPSI_LLM_TEMPERATURE=${TOPSI_LLM_TEMPERATURE:-0.7}
      - TOPSI_LLM_MAX_TOKENS=${TOPSI_LLM_MAX_TOKENS:-4000}
      # Pulse Engine / NATS Messaging
      - NATS_URL=${NATS_URL:-nats://nonlocal.info:4222}
      - PULSE_NATS_URL=${PULSE_NATS_URL:-nats://nonlocal.info:4222}
      # Email (SendGrid)
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@powerclubglobal.com}
      # Google OAuth (for email integration)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Zoho Integration
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID:-}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET:-}
      - ZOHO_REDIRECT_URI=${ZOHO_REDIRECT_URI:-}
      - ZOHO_DOMAIN=${ZOHO_DOMAIN:-com}
      # GitHub OAuth
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Social OAuth (LinkedIn, Instagram, Twitter/X, TikTok)
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID:-}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      # Storage OAuth (OneDrive / Dropbox)
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - DROPBOX_APP_KEY=${DROPBOX_APP_KEY:-}
      - DROPBOX_APP_SECRET=${DROPBOX_APP_SECRET:-}
      # Redirect bases for OAuth callbacks
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      # GitHub PAT for Auri (coding agent) — clone/push/PR on behalf of PCG
      - GITHUB_PAT=${GITHUB_PAT:-}
      - GH_TOKEN=${GITHUB_PAT:-}
      - GITHUB_ORG=${GITHUB_ORG:-Powerclub-Global}
      # Auri coding agent paths (volumes mounted below)
      - CLAUDE_BIN=/home/pythia/.nvm/versions/node/v22.20.0/bin/claude
      - GH_BIN=/home/pythia/.local/bin/gh
      - AURI_WORKSPACES_DIR=/home/pythia/auri-workspaces
      - AURI_HOME=/home/pythia
      # APN (Alpha Protocol Network) — native peer manager (bridge retired)
      - AUTO_START_APN=${AUTO_START_APN:-false}
      - APN_NODE_ID=${APN_NODE_ID:-apn_814d37f4}
      - APN_WALLET_ADDRESS=${APN_WALLET_ADDRESS:-0x814d37f4ab0c7ef2d9c7aa5f3de9fc5c0f79b3b576b77f84edc9e773eed71c92}
      - APN_CAPABILITIES=${APN_CAPABILITIES:-compute,relay,storage}
      # Admin API Key (used for WebDAV APN Drive auth)
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      # Persist database
      - ./dev_assets:/app/dev_assets
      # Persist repositories
      - repos_data:/repos
      # Access backups for restore on container startup
      - ./backups:/app/backups
      # Auri coding agent: expose host claude CLI, gh CLI, and workspace dir
      - /home/pythia/.nvm:/home/pythia/.nvm:ro
      - /home/pythia/.local/bin:/home/pythia/.local/bin:ro
      - /home/pythia/.config/gh:/home/pythia/.config/gh:ro
      - /home/pythia/.claude:/home/pythia/.claude:ro
      - /home/pythia/auri-workspaces:/home/pythia/auri-workspaces:rw
      # Share frontend dist with nginx
      - frontend-dist:/app/frontend/dist
      # Share docs site with nginx
      - docs-site:/app/docs-site
      # Version tracking for auto-updater
      - version-data:/app/version
    ports:
      - "3001:3001"        # Main application API
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      app-network:
        aliases:
          - app
          - pcg-cc-mcp

  # Automated database backup service
  db-backup:
    image: alpine:latest
    container_name: pcg-db-backup
    restart: always
    environment:
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./dev_assets:/data:ro
      - ./backups:/backups
    command: >
      sh -c '
        echo "🔄 Backup service started"
        echo "📅 Backup interval: $$BACKUP_INTERVAL seconds"
        echo "🗑️  Retention: $$BACKUP_RETENTION_DAYS days"

        mkdir -p /backups

        # Initial backup on startup
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        if [ -f /data/db.sqlite ]; then
          echo "📦 Creating initial backup: backup_$$TIMESTAMP.sqlite"
          cp /data/db.sqlite /backups/backup_$$TIMESTAMP.sqlite
          echo "✅ Initial backup complete"
        else
          echo "⚠️  No database found at /data/db.sqlite"
        fi

        # Periodic backup loop
        while true; do
          sleep $$BACKUP_INTERVAL

          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)

          if [ -f /data/db.sqlite ]; then
            echo "📦 Creating backup: backup_$$TIMESTAMP.sqlite"
            cp /data/db.sqlite /backups/backup_$$TIMESTAMP.sqlite
            ln -sf backup_$$TIMESTAMP.sqlite /backups/backup_latest.sqlite
            find /backups -name "backup_*.sqlite" -type f -mtime +$$BACKUP_RETENTION_DAYS -delete
            BACKUP_COUNT=$$(find /backups -name "backup_*.sqlite" -type f | wc -l)
            echo "✅ Backup complete. Total backups: $$BACKUP_COUNT"
          else
            echo "⚠️  Database file not found, skipping backup"
          fi
        done
      '
    depends_on:
      - app

  # Nginx - Reverse proxy router
  nginx:
    image: nginx:alpine
    container_name: pcg-nginx
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/app/frontend/dist:ro
      - docs-site:/app/docs-site:ro
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Tunnel for secure port forwarding
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pcg-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - cloudflared

  # Auto-updater - polls GitHub Releases for new versions
  # On update: git pull + docker compose build + docker compose up
  updater:
    image: alpine:latest
    container_name: pcg-updater
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-300}
      - GITHUB_REPO=${GITHUB_REPO:-powerclubglobal/pcg-cc-mcp}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - DOCKER_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-pcg-cc-mcp}
      - APP_CONTAINER=pcg-cc-mcp
      - REPO_PATH=/repo
    volumes:
      # Docker socket for compose commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount repo for git pull and docker compose
      - .:/repo
      # Version tracking
      - version-data:/app/version:rw
    working_dir: /repo
    command: sh /repo/scripts/release-updater.sh
    depends_on:
      - app
    networks:
      - app-network

volumes:
  repos_data:
    driver: local
  frontend-dist:
  docs-site:
  version-data:

networks:
  app-network:
    driver: bridge
